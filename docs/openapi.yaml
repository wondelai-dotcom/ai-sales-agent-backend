openapi: 3.0.3
info:
  title: AI Sales Agent Pro API
  version: 0.1.0
  description: >
    API multi-tenant per l'automazione della gestione clienti PMI tramite AI.
    Questo file copre i moduli gia' implementati (Auth, CRM). I moduli stub
    (AI, Calendar, Billing, WhatsApp, Notifications, Documents, Admin) verranno
    documentati man mano che vengono sviluppati.
servers:
  - url: http://localhost:4000/api
paths:
  /auth/register:
    post:
      summary: Registra una nuova azienda con utente Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ragioneSociale, email, password, nome, cognome]
              properties:
                ragioneSociale: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                nome: { type: string }
                cognome: { type: string }
      responses:
        "201": { description: Account creato, ritorna accessToken/refreshToken }
        "409": { description: Email gia' registrata }
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Login ok, ritorna accessToken/refreshToken }
        "401": { description: Credenziali non valide }
  /auth/refresh:
    post:
      summary: Rinnova l'access token
      responses:
        "200": { description: Nuova coppia di token }
  /clients:
    get:
      summary: Elenco clienti (ricerca, paginazione)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        "200": { description: Lista paginata di clienti }
    post:
      summary: Crea un cliente
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Cliente creato }
  /clients/{id}:
    get:
      summary: Dettaglio cliente
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Dettaglio cliente }
        "404": { description: Non trovato }
  /leads/pipeline-summary:
    get:
      summary: Conteggio lead per fase (dati per il grafico dashboard)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Conteggi per stage }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
